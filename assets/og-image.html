<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FOIA Lookup social preview source</title>
<!-- Source for og-image.png (1200x630). Re-render with a headless browser at that viewport after editing. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f7f4ee; color: #1f1d1a;
    font-family: 'IBM Plex Sans', sans-serif;
    border-top: 14px solid #8a3b12;
    padding: 56px 80px 0;
    display: flex; flex-direction: column;
  }
  .kicker { font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5b554c; }
  h1 { margin: 10px 0 0; font-family: 'Newsreader', Georgia, serif; font-size: 112px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
  .tagline { margin: 22px 0 0; font-size: 32px; line-height: 1.3; color: #3d3933; max-width: 960px; }
  .facts { margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid #1f1d1a; }
  .facts > div { padding: 22px 24px 24px; border-left: 1px solid #e2dccf; }
  .facts > div:first-child { padding-left: 0; border-left: 0; }
  .num { font-family: 'Newsreader', Georgia, serif; font-size: 52px; font-weight: 600; line-height: 1; }
  .lbl { margin-top: 8px; font-size: 21px; color: #5b554c; }
  .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2dccf; padding: 18px 0 26px; font-size: 20px; color: #5b554c; }
  .url { font-family: 'IBM Plex Mono', monospace; color: #1f1d1a; }
</style>
</head>
<body>
  <div class="kicker">Federal &amp; state public records</div>
  <h1>FOIA Lookup</h1>
  <p class="tagline">Find the right records office. Emails, request portals and statute deadlines, ready to copy.</p>
  <div class="facts">
    <div><div class="num">39</div><div class="lbl">Federal departments &amp; agencies</div></div>
    <div><div class="num">1,058</div><div class="lbl">State &amp; D.C. agencies</div></div>
    <div><div class="num">51</div><div class="lbl">Public records laws summarized</div></div>
  </div>
  <div class="foot"><span>Free, no sign-up</span><span class="url">reconsidering.github.io/foia-lookup</span></div>
</body>
</html>
