<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOIA Lookup</title>
    <meta name="description" content="Find the right FOIA and public records office for 39 federal departments and agencies and 1,058 state and D.C. agencies, with emails, request portals and statute deadlines ready to copy.">
    <link rel="canonical" href="https://reconsidering.github.io/foia-lookup/FOIA_Lookup.html">
    <meta name="theme-color" content="#8a3b12">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FOIA Lookup">
    <meta property="og:title" content="FOIA Lookup: find the right public records office">
    <meta property="og:description" content="Emails, request portals and statute deadlines for federal agencies, all 50 states and D.C., ready to copy.">
    <meta property="og:url" content="https://reconsidering.github.io/foia-lookup/FOIA_Lookup.html">
    <meta property="og:image" content="https://reconsidering.github.io/foia-lookup/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="FOIA Lookup: 39 federal departments and agencies, 1,058 state and D.C. agencies, 51 public records laws summarized.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FOIA Lookup: find the right public records office">
    <meta name="twitter:description" content="Emails, request portals and statute deadlines for federal agencies, all 50 states and D.C., ready to copy.">
    <meta name="twitter:image" content="https://reconsidering.github.io/foia-lookup/assets/og-image.png">
    <meta name="twitter:image:alt" content="FOIA Lookup: 39 federal departments and agencies, 1,058 state and D.C. agencies, 51 public records laws summarized.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
    <style>
        :root {
            --paper: #f7f4ee;
            --card: #ffffff;
            --ink: #1f1d1a;
            --ink-2: #3d3933;
            --muted: #5b554c;
            --rule: #e2dccf;
            --accent: #8a3b12;
            --accent-hover: #5e2509;
            --warn-bg: #fbeee4;
            --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
            --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.45;
        }

        a { color: var(--accent); }
        a:hover { color: var(--accent-hover); }

        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        .visually-hidden {
            position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap;
        }

        .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* Masthead */
        .masthead { border-bottom: 2px solid var(--ink); }

        .masthead-top {
            display: flex; flex-wrap: wrap; gap: 16px;
            align-items: center; justify-content: space-between;
            padding-top: 20px; padding-bottom: 12px;
        }

        .brand {
            font-family: var(--serif); font-size: 30px; font-weight: 600;
            letter-spacing: -0.01em; margin: 0;
        }

        .search-container { position: relative; flex: 0 1 480px; min-width: 0; }

        .search-box { display: flex; gap: 8px; }

        .search-box input {
            flex: 1; min-width: 0; height: 46px; padding: 0 14px;
            font: inherit; font-size: 16px; color: var(--ink);
            background: var(--card); border: 1px solid var(--ink); border-radius: 2px;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 44px; padding: 0 16px;
            font: inherit; font-size: 14px; font-weight: 600; text-decoration: none;
            border-radius: 2px; cursor: pointer; white-space: nowrap;
        }

        .btn-dark { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
        .btn-dark:hover { background: #000; color: var(--paper); }
        .btn-accent { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
        .btn-accent:hover { background: var(--accent-hover); color: #fff; }
        .btn-outline { background: var(--card); color: var(--ink); border: 1px solid var(--ink); }
        .btn-outline:hover { background: var(--paper); color: var(--ink); }

        .search-box .btn { height: 46px; font-size: 15px; }

        .suggestions-dropdown {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
            background: var(--card); border: 1px solid var(--ink); border-top: none;
            max-height: 280px; overflow-y: auto; display: none;
            box-shadow: 0 6px 16px rgba(31, 29, 26, 0.12);
        }

        .suggestion-item {
            display: block; width: 100%; text-align: left;
            padding: 10px 14px; font: inherit; font-size: 15px; color: var(--ink);
            background: var(--card); border: 0; border-bottom: 1px solid var(--rule); cursor: pointer;
        }

        .suggestion-item:hover, .suggestion-item:focus-visible { background: var(--paper); }

        .tabs { display: flex; gap: 24px; }

        .tab-btn {
            padding: 12px 0; font: inherit; font-size: 15px; color: var(--muted);
            background: none; border: 0; border-bottom: 3px solid transparent; cursor: pointer;
        }

        .tab-btn.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

        .status-banner { font-size: 13px; color: var(--muted); padding: 10px 0 0; }
        .status-warning { color: var(--accent); font-weight: 600; }

        /* Layout */
        .layout {
            display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start;
            padding-top: 28px; padding-bottom: 64px;
        }

        .rail { flex: 1 1 220px; min-width: 0; max-width: 260px; }

        .rail-label, .kicker {
            font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--muted);
        }

        .rail-list {
            margin-top: 10px; max-height: 70vh; overflow-y: auto;
            display: flex; flex-direction: column;
        }

        .rail-item {
            text-align: left; padding: 9px 0; font: inherit; font-size: 15px;
            color: var(--ink); background: none; border: 0;
            border-bottom: 1px solid var(--rule); cursor: pointer;
        }

        .rail-item:hover { color: var(--accent); }
        .rail-item.active { color: var(--accent); font-weight: 600; }

        main { flex: 999 1 560px; min-width: 0; }

        .empty-state { padding: 8px 0; }
        .empty-state h2 { font-family: var(--serif); font-size: 36px; font-weight: 600; margin: 6px 0 8px; line-height: 1.1; }
        .empty-state p { color: var(--ink-2); margin: 0; max-width: 560px; }

        .output-section { display: none; }

        .page-title {
            margin: 6px 0 4px; font-family: var(--serif);
            font-size: 48px; line-height: 1.05; font-weight: 600;
        }

        /* Statute block */
        .state-info-box { display: none; margin-bottom: 28px; }

        .law { margin-bottom: 20px; }
        .law:last-child { margin-bottom: 0; }

        .law-name { margin: 0 0 12px; font-size: 17px; color: var(--ink-2); }
        .law-name .citation { font-family: var(--mono); font-size: 15px; }

        .law-facts {
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
            margin: 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
        }

        .law-facts > div { padding: 16px; border-left: 1px solid var(--rule); }
        .law-facts > div:first-child { padding-left: 0; border-left: 0; }
        .law-facts dt { font-size: 13px; color: var(--muted); }
        .law-facts dd { margin: 4px 0 0; font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2; }
        .law-facts dd.small { font-family: var(--sans); font-size: 15px; font-weight: 400; line-height: 1.4; }

        /* Copy panel */
        .copy-panel {
            background: var(--card); border: 1px solid var(--rule);
            padding: 20px; margin-bottom: 28px;
        }

        .copy-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
        .copy-title { margin: 0; font-size: 16px; }
        .copy-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
        .copy-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .copy-panel details { margin-top: 14px; }
        .copy-panel summary { cursor: pointer; font-size: 14px; color: var(--accent); }

        .copy-panel label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }

        textarea {
            width: 100%; height: 72px; padding: 8px;
            font-family: var(--mono); font-size: 13px; color: var(--ink);
            background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; resize: vertical;
        }

        /* Agency list */
        .list-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
        .results-header { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 600; }
        .results-summary { font-size: 14px; color: var(--ink-2); }

        .results-list { border-top: 1px solid var(--ink); }

        .agency-row {
            display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) minmax(0, 1fr);
            gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--rule); align-items: start;
        }

        .agency-name { font-weight: 600; font-size: 16px; }
        .agency-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .agency-email { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
        .agency-none { font-size: 14px; color: var(--ink-2); }
        .agency-note { font-size: 13px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
        .agency-source { font-size: 13px; margin-top: 4px; }
        .agency-action { text-align: right; }

        @media (max-width: 760px) {
            .wrap { padding: 0 16px; }
            .brand { font-size: 26px; }
            .search-container { flex-basis: 100%; }
            .rail { max-width: none; flex-basis: 100%; order: 2; }
            .rail-list { max-height: 220px; }
            .page-title { font-size: 36px; }
            .law-facts { grid-template-columns: minmax(0, 1fr); }
            .law-facts > div { padding: 12px 0; border-left: 0; border-top: 1px solid var(--rule); }
            .law-facts > div:first-child { border-top: 0; }
            .agency-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
            .agency-action { text-align: left; }
        }
    </style>
</head>
<body>

<header class="masthead">
    <div class="wrap">
        <div class="masthead-top">
            <p class="brand">FOIA Lookup</p>
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" aria-label="Search departments and agencies" placeholder="Department, agency or acronym" autocomplete="off">
                    <button class="btn btn-dark" type="button" onclick="executeSearch()">Search</button>
                </div>
                <div id="suggestionsDropdown" class="suggestions-dropdown"></div>
            </div>
        </div>
        <nav class="tabs" aria-label="Jurisdiction">
            <button id="tabFederal" type="button" class="tab-btn active" onclick="switchTab('federal')">Federal</button>
            <button id="tabState" type="button" class="tab-btn" onclick="switchTab('state')">States &amp; D.C.</button>
        </nav>
    </div>
</header>

<div class="wrap">
    <div id="statusBanner" role="status" class="status-banner">Loading FOIA database files...</div>

    <div class="layout">
        <nav class="rail" aria-labelledby="railLabel">
            <div id="railLabel" class="rail-label">Departments</div>
            <div id="railList" class="rail-list"></div>
        </nav>

        <main>
            <div id="emptyState" class="empty-state">
                <div class="kicker">Start here</div>
                <h2>Find the right records office</h2>
                <p>Search a department, agency, state or acronym, or pick one from the list. You get every listed contact, portal link and a ready-to-paste email list.</p>
            </div>

            <div id="outputSection" class="output-section">
                <div id="pageKicker" class="kicker"></div>
                <h1 id="stateStatuteName" class="page-title"></h1>

                <div id="stateInfoBox" class="state-info-box">
                    <div id="stateDetails"></div>
                </div>

                <section id="copyPanel" class="copy-panel" aria-labelledby="copyTitle">
                    <div class="copy-row">
                        <div>
                            <h2 id="copyTitle" class="copy-title"></h2>
                            <div id="copySub" class="copy-sub"></div>
                        </div>
                        <div class="copy-actions">
                            <button id="copyComma" class="btn btn-accent" type="button" onclick="copyToClipboard('commaEmails')">Copy for Gmail</button>
                            <button id="copySemicolon" class="btn btn-outline" type="button" onclick="copyToClipboard('semicolonEmails')">Copy for Outlook</button>
                        </div>
                    </div>
                    <details>
                        <summary>Show addresses</summary>
                        <label for="commaEmails">Comma-separated (Gmail, webmail)</label>
                        <textarea id="commaEmails" readonly></textarea>
                        <label for="semicolonEmails">Semicolon-separated (Outlook, desktop apps)</label>
                        <textarea id="semicolonEmails" readonly></textarea>
                    </details>
                </section>

                <div class="list-head">
                    <h2 id="resultsHeader" class="results-header"></h2>
                    <div id="resultsSummary" class="results-summary"></div>
                </div>
                <div id="resultsList" class="results-list"></div>
            </div>
        </main>
    </div>
</div>

<script>
    let currentTab = 'federal';
    let FOIA_DATABASE = [];
    let STATE_DATABASE = [];

    const FEDERAL_LAW = {
        statute: 'Freedom of Information Act',
        citation: '5 U.S.C. § 552',
        response_days: '20 business days',
        residency_required: false
    };

    const input = document.getElementById('searchInput');
    const dropdown = document.getElementById('suggestionsDropdown');
    const banner = document.getElementById('statusBanner');
    const loadErrors = {};

    function normalize(value) {
        return String(value || '').trim().toLowerCase();
    }

    function isHttpUrl(value) {
        return typeof value === 'string' && /^https?:\/\//i.test(value);
    }

    function validateDatabase(data, mode) {
        if (!Array.isArray(data) || !data.length) throw new Error('Empty or invalid database');
        for (const group of data) {
            const contacts = mode === 'federal' ? group.components : group.agencies;
            if (typeof (mode === 'federal' ? group.deptName : group.state) !== 'string'
                || !Array.isArray(contacts) || contacts.some(contact =>
                    typeof contact.title !== 'string' || !Array.isArray(contact.emails)
                    || contact.emails.some(email => typeof email !== 'string')
                    || (contact.portal !== undefined && typeof contact.portal !== 'string')
                    || (contact.portalLabel !== undefined && typeof contact.portalLabel !== 'string')
                    || (contact.note !== undefined && typeof contact.note !== 'string')
                    || (contact.sourceUrl !== undefined && typeof contact.sourceUrl !== 'string')
                    || (contact.sourceChecked !== undefined && (typeof contact.sourceChecked !== 'string'
                        || !/^\d{4}-\d{2}-\d{2}$/.test(contact.sourceChecked))))) {
                throw new Error('Invalid database structure');
            }
        }
        return data;
    }

    function groups() {
        return currentTab === 'federal' ? FOIA_DATABASE : STATE_DATABASE;
    }

    function groupName(group) {
        return currentTab === 'federal' ? group.deptName : group.state;
    }

    function groupContacts(group) {
        return currentTab === 'federal' ? group.components : group.agencies;
    }

    function updateStatus() {
        const data = groups();
        if (loadErrors[currentTab]) {
            banner.className = 'status-banner status-warning';
            banner.textContent = 'Unable to load the ' + currentTab + ' database. Serve this folder over HTTP, then reload the page.';
        } else {
            banner.className = 'status-banner';
            banner.textContent = data.length
                ? (currentTab === 'federal' ? data.length + ' federal departments and agencies.' : data.length + ' states and D.C.') + ' Contacts are unverified unless noted; confirm with the agency before relying on them.'
                : 'Loading database...';
        }
        renderRail();
    }

    async function loadDatabase(mode, path) {
        try {
            const response = await fetch(path);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = validateDatabase(await response.json(), mode);
            if (mode === 'federal') FOIA_DATABASE = data;
            else STATE_DATABASE = data;
        } catch (error) {
            loadErrors[mode] = error.message;
        }
        updateStatus();
    }

    function addText(parent, className, text, tag) {
        const node = document.createElement(tag || 'div');
        node.className = className;
        node.textContent = text;
        parent.appendChild(node);
        return node;
    }

    function renderRail() {
        const list = document.getElementById('railList');
        document.getElementById('railLabel').textContent = currentTab === 'federal' ? 'Departments & agencies' : 'Jurisdictions';
        list.replaceChildren();
        const selected = normalize(input.value);
        const sorted = [...groups()].sort((a, b) => groupName(a).localeCompare(groupName(b)));
        for (const group of sorted) {
            const name = groupName(group);
            const button = addText(list, 'rail-item' + (normalize(name) === selected ? ' active' : ''), name, 'button');
            button.type = 'button';
            if (normalize(name) === selected) button.ariaCurrent = 'true';
            button.addEventListener('click', () => { input.value = name; executeSearch(); });
        }
    }

    function clearResults() {
        document.getElementById('outputSection').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('stateInfoBox').style.display = 'none';
        document.getElementById('stateDetails').replaceChildren();
        document.getElementById('resultsList').replaceChildren();
        document.getElementById('commaEmails').value = '';
        document.getElementById('semicolonEmails').value = '';
        dropdown.replaceChildren();
        dropdown.style.display = 'none';
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabFederal').classList.toggle('active', tab === 'federal');
        document.getElementById('tabState').classList.toggle('active', tab === 'state');
        input.placeholder = tab === 'federal' ? 'Department, agency or acronym' : 'State, statute or agency';
        input.value = '';
        clearResults();
        updateStatus();
    }

    function matches(query) {
        return groups().flatMap(group => {
            const parentFields = currentTab === 'federal' ? [group.deptName, group.deptAbbr] : [group.state, group.statute, group.citation];
            const parentMatch = parentFields.some(value => normalize(value).includes(query));
            return groupContacts(group).filter(contact => parentMatch || [contact.title, contact.abbr].some(value => normalize(value).includes(query)))
                .map(contact => ({group, contact}));
        });
    }

    function renderLaw(parent, law, label, contacts) {
        const block = addText(parent, 'law', '');
        const name = addText(block, 'law-name', (label ? label + ': ' : '') + law.statute + ' · ', 'p');
        addText(name, 'citation', law.citation, 'span');
        const facts = addText(block, 'law-facts', '', 'dl');
        const fact = (term, value, small) => {
            const cell = addText(facts, '', '');
            addText(cell, '', term, 'dt');
            addText(cell, small ? 'small' : '', value, 'dd');
        };
        fact('Response deadline', law.response_days);
        fact('Residency required', law.residency_required ? 'Yes' : 'No');
        const portals = [...new Set(contacts.map(contact => contact.portal).filter(isHttpUrl))];
        const howTo = addText(facts, '', '');
        addText(howTo, '', 'How to file', 'dt');
        const dd = addText(howTo, 'small', currentTab === 'federal' ? 'Each office handles its own requests. ' : 'Contact each agency’s records officer. ', 'dd');
        const shared = currentTab === 'federal' ? 'https://www.foia.gov/' : (portals.length === 1 && contacts.every(contact => contact.portal === portals[0]) ? portals[0] : '');
        if (shared) {
            const link = document.createElement('a');
            link.href = shared;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = currentTab === 'federal' ? 'FOIA.gov' : 'Shared request portal';
            dd.appendChild(link);
        }
    }

    function addLink(parent, className, url, text) {
        if (!isHttpUrl(url)) return null;
        const link = document.createElement('a');
        link.className = className;
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = text;
        parent.appendChild(link);
        return link;
    }

    function renderRow(list, contact, showGroup, group) {
        const row = addText(list, 'agency-row', '');
        const who = addText(row, '', '');
        addText(who, 'agency-name', contact.title);
        const meta = [showGroup ? groupName(group) : '', contact.abbr, contact.phone].filter(Boolean).join(' \u00b7 ');
        if (meta) addText(who, 'agency-meta', meta);

        const how = addText(row, '', '');
        if (contact.emails.length) {
            for (const email of contact.emails) addText(how, 'agency-email', email);
        } else {
            addText(how, 'agency-none', 'No verified email listed');
        }
        if (contact.note) addText(how, 'agency-note', contact.note);
        else if (!contact.emails.length && !contact.phone && !isHttpUrl(contact.portal)) {
            addText(how, 'agency-note', 'No verified contact information is available in this directory.');
        }
        if (isHttpUrl(contact.sourceUrl)) {
            const source = addText(how, 'agency-source', '');
            addLink(source, '', contact.sourceUrl, 'Official source' + (contact.sourceChecked ? ' (checked ' + contact.sourceChecked + ')' : ''));
        }

        const action = addText(row, 'agency-action', '');
        addLink(action, 'btn ' + (contact.emails.length ? 'btn-outline' : 'btn-dark'), contact.portal, contact.portalLabel || 'Open portal');
    }

    function executeSearch() {
        clearResults();
        const query = normalize(input.value);
        renderRail();
        if (!query) return;
        const rows = matches(query);
        const matchedGroups = [...new Set(rows.map(row => row.group))];
        const federal = currentTab === 'federal';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('outputSection').style.display = 'block';

        document.getElementById('pageKicker').textContent = federal ? 'Federal FOIA' : 'Public records law';
        document.getElementById('stateStatuteName').textContent = matchedGroups.length === 1
            ? groupName(matchedGroups[0])
            : rows.length ? 'Results for “' + input.value.trim() + '”' : 'No results';

        const info = document.getElementById('stateDetails');
        if (federal && rows.length) {
            renderLaw(info, FEDERAL_LAW, '', rows.map(row => row.contact));
        } else {
            for (const group of matchedGroups) {
                renderLaw(info, group, matchedGroups.length > 1 ? group.state : '', group.agencies);
            }
        }
        document.getElementById('stateInfoBox').style.display = rows.length ? 'block' : 'none';

        const emails = [...new Map(rows.flatMap(row => row.contact.emails)
            .map(email => email.trim()).filter(Boolean).map(email => [email.toLowerCase(), email])).values()];
        const withoutEmail = rows.filter(row => !row.contact.emails.some(email => email.trim())).length;
        document.getElementById('commaEmails').value = emails.join(', ');
        document.getElementById('semicolonEmails').value = emails.join('; ');
        document.getElementById('copyPanel').style.display = rows.length ? 'block' : 'none';
        document.getElementById('copyTitle').textContent = emails.length
            ? 'Copy ' + (emails.length === 1 ? 'the email' : 'all ' + emails.length + ' emails')
            : 'No emails to copy';
        document.getElementById('copySub').textContent = withoutEmail
            ? withoutEmail + (withoutEmail === 1 ? ' office has' : ' offices have') + ' no email and ' + (withoutEmail === 1 ? 'is' : 'are') + ' not included. See their entries below for other request options.'
            : 'Paste into the To: or Bcc: line.';
        document.getElementById('copyComma').disabled = !emails.length;
        document.getElementById('copySemicolon').disabled = !emails.length;

        const noun = federal ? 'Offices' : 'Agencies';
        document.getElementById('resultsHeader').textContent = rows.length ? noun + ' (' + rows.length + ')' : 'No matching contacts found.';
        document.getElementById('resultsSummary').textContent = rows.length
            ? (rows.length - withoutEmail) + ' with email · ' + withoutEmail + ' without'
            : 'Try a department name, an acronym such as FBI, or a state.';

        const list = document.getElementById('resultsList');
        for (const {group, contact} of rows) renderRow(list, contact, matchedGroups.length > 1, group);
    }

    function showSuggestions() {
        dropdown.replaceChildren();
        const query = normalize(input.value);
        if (!query) { dropdown.style.display = 'none'; return; }
        const suggestions = new Map();
        for (const {group, contact} of matches(query)) {
            suggestions.set(groupName(group), 'Group');
            suggestions.set(contact.title, 'Agency');
        }
        for (const [name, type] of [...suggestions].slice(0, 12)) {
            const button = addText(dropdown, 'suggestion-item', name + ' (' + type + ')', 'button');
            button.type = 'button';
            button.addEventListener('click', () => { input.value = name; executeSearch(); });
        }
        dropdown.style.display = suggestions.size ? 'block' : 'none';
    }

    async function copyToClipboard(id) {
        const field = document.getElementById(id);
        if (!field.value) return;
        try {
            await navigator.clipboard.writeText(field.value);
            banner.textContent = 'Emails copied to clipboard.';
        } catch (error) {
            const details = field.closest && field.closest('details');
            if (details) details.open = true;
            field.focus();
            field.select();
            banner.textContent = 'Clipboard unavailable. The emails are selected; press Ctrl+C or Command+C to copy.';
        }
    }

    input.addEventListener('input', showSuggestions);
    input.addEventListener('keydown', event => {
        if (event.key === 'Enter') executeSearch();
        if (event.key === 'Escape') dropdown.style.display = 'none';
    });
    document.addEventListener('click', event => {
        if (!event.target.closest('.search-container')) dropdown.style.display = 'none';
    });
    loadDatabase('federal', './foia_data.json');
    loadDatabase('state', './state_foia_data.json');
</script>
</body>
</html>
